<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="/style/contact.css">
    <link rel="stylesheet" href="/style/fonts.css">
</head>
<body>
    <header class="navbar">
        <!-- Website icon -->
        <div class="icon">
            <img src="assets/header/logo.png" alt="Furgo Logo">
            <h2 class="head-name">Furgo</h2>
        </div>
        <!-- Links -->
        <div class="links poppins-regular">
            <a href="/">Home</a>
            <a href="/shop.html">Shop</a>
            <a href="/about.html">About</a>
            <a href="/contact.html">Contact</a>
        </div>
        <!-- Reference -->
        <div class="reference">
            <button type="button"><img src="/assets/header/person.png"></button>
            <button type="button"><img src="/assets/header/search.png"></button>
            <button type="button"><img src="/assets/header/like.png"></button>
            <button type="button"><img src="/assets/header/shop.png"></button>
        </div>
    </header>

    <section class="container-wrapper">
        <div class="container">
            <img src="assets/contact_background/Rectangle 1.png" alt="contact_background" style="width: 150%;">

        <div class="container-inside">
            <img src="assets/header/logo.png" alt="">
            <h1>Contact</h1>
        </div>

        <div class="lower-section">
            <button onclick="window.location.href='http://127.0.0.1:5500/index.html'"> Home</button>
            <img src="assets/contact_background/arrow.png" alt="arrow">
            <button onclick="window.location.href='http://127.0.0.1:5500/contact.html'"> Contact</button>
        </div>
    </div>
</section>

<section class="main-wrapper">
    <div class="main-container">
        <div class="main-head">
            <h1>Get In Touch With Us</h1>
            <p>For More Information About Our Product & Services. Please Feel Free To Drop Us An Email. Our Staff Always Be There To Help You Out. Do Not Hesitate!</p>
        </div>

        <div class="med">
            <div class="one">
                <img src="/assets/contact-inside/Vector.png" alt="">
                <h2>Address</h2>
            </div>
        </div>
    </div>
</section>
</body>
</html>
